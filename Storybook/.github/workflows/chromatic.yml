name: Chromatic
on:
  push:
    branches: ["**"] # run on all branches; narrow if you prefer
  pull_request: # enables PR checks/comments
permissions:
  contents: read
  checks: write
  statuses: write
  pull-requests: write
jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # If your package.json is in the root, do this first:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci
        # If your package.json is in a subdirectory, use:
        # working-directory: Storybook/Storybook

      - name: Publish to Chromatic
        uses: chromaui/action@v1
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          token: ${{ secrets.GITHUB_TOKEN }}
          # Only include workingDir if your Storybook is actually in a subdirectory
          # workingDir: Storybook/Storybook
